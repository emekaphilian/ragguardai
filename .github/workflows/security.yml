name: Security

on:
  push:
  pull_request:

jobs:
  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install the tested application environment
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          python -m pip install -r requirements.txt
          python -m pip install --no-build-isolation -e ".[dev,postgres,llm]"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Check installed dependencies
        run: python -m pip check

      - name: Audit installed application and build dependencies
        run: pip-audit --local
