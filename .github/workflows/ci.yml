name: CI

on:
  push:
  pull_request:

jobs:
  oidc-transport-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: httpx-0.27.2
            httpx-spec: httpx==0.27.2
            httpcore-spec: "httpcore>=1.0.9,<2"
          - label: httpx-0.28.1
            httpx-spec: httpx==0.28.1
            httpcore-spec: "httpcore>=1.0.9,<2"
          - label: latest-supported-httpx-0.x
            httpx-spec: "httpx>=0.27,<1"
            httpcore-spec: "httpcore>=1.0.9,<2"
    name: OIDC transport (${{ matrix.label }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Select HTTPX and HTTPCore compatibility targets
        run: >-
          python -m pip install --upgrade
          '${{ matrix.httpx-spec }}'
          '${{ matrix.httpcore-spec }}'

      - name: Report HTTPX and HTTPCore versions
        run: python -m pip show httpx httpcore

      - name: Run OIDC transport and authentication tests
        run: >-
          python -m pytest -q
          tests/api/test_oidc_transport.py
          tests/api/test_oidc_authentication.py
          tests/api/test_middleware_tenant_default.py
          tests/unit/test_auth_repository.py
          tests/unit/test_authentication_config.py
          tests/unit/test_admin_session_authorization.py
          tests/unit/test_principal_authorization.py

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ragguard_test
          POSTGRES_USER: ragguard
          POSTGRES_PASSWORD: ragguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragguard -d ragguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAGGUARD_TEST_DATABASE_URL: postgresql://ragguard:ragguard_test@localhost:5432/ragguard_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install PostgreSQL backup utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run tests
        run: python -m pytest -q

      - name: Run pipeline smoke test
        run: python scripts/run_pipeline.py

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
