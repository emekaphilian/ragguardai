services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app/src
    command: ["python", "-m", "uvicorn", "ragguard.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
