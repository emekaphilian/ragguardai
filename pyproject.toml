[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragguard"
version = "0.1.0"
description = "RAG failure detection and auto-repair system"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "pydantic>=2,<3",
  "fastapi>=0.110,<1",
  "pyyaml>=6,<7",
  "python-multipart>=0.0.9,<1",
  "pypdf>=4,<7",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "python-pptx>=0.6.23,<2",
  "langgraph>=0.2,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
postgres = ["psycopg[binary]>=3.2,<4"]
llm = ["openai>=1.30,<2", "anthropic>=0.30,<1", "cohere>=5,<6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
